{% extends "base.html" %}
{% block title %}Login · VM Classroom{% endblock %}
{% block content %}
<section class="auth-panel">
    <h1>Sign in</h1>
    <form method="post">
        {{ form.hidden_tag() }}
        <label>{{ form.email.label }} {{ form.email(autocomplete="email") }}</label>
        <label>{{ form.password.label }} {{ form.password(autocomplete="current-password") }}</label>
        {{ form.submit(class="primary") }}
    </form>
</section>
{% endblock %}
