{% extends "base.html" %}
{% block title %}Change Password · VM Classroom{% endblock %}
{% block content %}
<section class="auth-panel">
    <h1>Change password</h1>
    <form method="post">
        {{ form.hidden_tag() }}
        <label>{{ form.current_password.label }} {{ form.current_password(autocomplete="current-password") }}</label>
        <label>{{ form.password.label }} {{ form.password(autocomplete="new-password") }}</label>
        <label>{{ form.confirm.label }} {{ form.confirm(autocomplete="new-password") }}</label>
        {{ form.submit(class="primary") }}
    </form>
</section>
{% endblock %}
